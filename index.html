<script>
'use strict';
/* ============================================================
   竹知了 —— 传统玩具模拟
   物理：甩杆(指针) → 绳系竹筒(质点, 重力+弹性绳+阻力)
   声学：首选真实竹知了录音采样(转速驱动回放速率)；
         解码失败回退合成链(锯齿波→调幅→扫频带通→共振峰)
   ============================================================ */

// roundRect 需 Safari 16+/Chrome 99+，旧内核补一个 arcTo 实现避免整页崩掉
if(!('roundRect' in CanvasRenderingContext2D.prototype)){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(Math.abs(+r) || 0, w/2, h/2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 玩具参数 ---------- */
let ROPE_LEN = 150;       // 绳长 px（随屏幕尺寸调整）
let AUTO_R   = 58;        // 自动甩画圈半径（随屏幕尺寸调整）
const ROPE_K   = 2600;    // 绳弹性 (加速度/px)
const ROPE_D   = 14;      // 绳径向阻尼
const GRAV     = 1150;    // 重力 px/s^2
const AIR_DRAG = 0.35;    // 空气阻力系数

/* ---------- 状态 ---------- */
const stick  = { x: 0, y: 0 };            // 甩杆杆梢
const target = { x: 0, y: 0 };            // 指针目标
const tube   = { x: 0, y: 0, vx: 0, vy: 0 }; // 竹筒(质点)
const pointer = { down: false, id: null, lift: 0 };  // lift: 触摸时锚点上移量
const auto = { on: false, rps: 0, phase: 0, cx: 0, cy: 0 };
let interacted = false;                   // 玩家是否已上手

function recenterToy(){
  target.x = stick.x = W*0.5;
  target.y = stick.y = H*0.42;
  tube.x = stick.x + 8;
  tube.y = stick.y + ROPE_LEN*0.92;
  tube.vx = 34; tube.vy = 0;
  prevTheta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
}

let theta = 0, prevTheta = 0, omega = 0;  // 绳方向角与角速度
let ropeDist = ROPE_LEN, taut = 0;
let rps = 0, drive = 0, active = 0;       // 声音驱动量 0~1
let singTime = 0, hintGone = false;
let idleTime = 0;                         // 完全静置的累计时长
let revAccum = 0;                         // 手动甩的角度累计(每 2π 记一哇)
let needSoundTime = 0;                    // "想出声却出不了"的持续时长

/* ---------- ycd.png 替换蝉身（转的就是这张图） ---------- */
const ycdImg = new Image();
ycdImg.src = 'res/ycd.png';
let spin2d = 0;                           // 2D 蝉身自旋角（随转速累计）

/* ---------- 场景缓存(随 resize 重建为离屏层，避免每帧全屏静态重绘) ---------- */
let bgLayer = null, moonBambooLayer = null, fgLayer = null;
let stars = [], flies = [];
let grainTile = null;
let stickGrad = null, tubeGrad = null;    // 玩具渐变(局部坐标恒定，只建一次)

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resize(){
  // 面板折叠/键盘弹出/嵌入环境会瞬时报 0：直接跳过本次，等尺寸恢复再重建，
  // 否则 1×1 的画布会把玩具永久夹到左上角（interacted 后不再回中）
  if(!(window.innerWidth > 0 && window.innerHeight > 0)) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 移动端优先：小屏上绳更短、圈更小，拇指画小圈就能甩起来，
  // 且自动甩轨道(绳长+拉伸+圈半径)不出屏
  const minDim = Math.min(W, H);
  ROPE_LEN = clamp(minDim*0.28, 90, 150);
  AUTO_R   = clamp(minDim*0.13, 38, 58);

  // 玩家还没上手时，窗口变化就把玩具重新挂回屏幕中央
  if(!interacted) recenterToy();
  else { target.x = clamp(target.x, 0, W); target.y = clamp(target.y, 0, H); }

  // 旋屏/缩放后自动甩圆心重新钳制，避免玩具整体转出屏幕
  if(auto.on){
    auto.cx = clamp(auto.cx, W*0.28, W*0.72);
    auto.cy = clamp(auto.cy, H*0.26, H*0.6);
  }

  const rnd = mulberry32(2024);
  stars = [];
  for(let i = 0; i < 110; i++){
    stars.push({ x: rnd()*W, y: rnd()*H*0.72, r: 0.5 + rnd()*1.1,
                 a: 0.15 + rnd()*0.55, ph: rnd()*TAU, sp: 0.4 + rnd()*1.2 });
  }
  flies = [];
  for(let i = 0; i < 12; i++){
    flies.push({ x: rnd()*W, y: H*(0.45 + rnd()*0.5),
                 vx: (rnd()-0.5)*22, vy: (rnd()-0.5)*12,
                 ph: rnd()*TAU, sp: 0.8 + rnd()*1.4 });
  }
  buildBgLayer();
  buildMoonBambooLayer();
  buildFgLayer();
  if(typeof toy3d !== 'undefined' && toy3d) toy3d.resize(W, H, DPR, toyScale());
}

function newLayer(){
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

/* 背景层：天空渐变 + 地平线暖光 */
function buildBgLayer(){
  const [c, b] = newLayer();
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#0a1028');
  sky.addColorStop(0.45, '#16204a');
  sky.addColorStop(0.78, '#2c2a55');
  sky.addColorStop(1,    '#43325a');
  b.fillStyle = sky; b.fillRect(0, 0, W, H);
  const glow = b.createRadialGradient(W*0.5, H*1.12, 0, W*0.5, H*1.12, H*0.75);
  glow.addColorStop(0, 'rgba(232,140,84,0.16)');
  glow.addColorStop(1, 'rgba(232,140,84,0)');
  b.fillStyle = glow; b.fillRect(0, 0, W, H);
  bgLayer = c;
}

/* 月亮 + 竹影剪影层 */
function buildMoonBambooLayer(){
  const [c, b] = newLayer();

  const mx = W*0.78, my = H*0.18;
  const mg = b.createRadialGradient(mx, my, 4, mx, my, 150);
  mg.addColorStop(0, 'rgba(247,232,200,0.32)');
  mg.addColorStop(0.25, 'rgba(247,232,200,0.10)');
  mg.addColorStop(1, 'rgba(247,232,200,0)');
  b.fillStyle = mg; b.beginPath(); b.arc(mx, my, 150, 0, TAU); b.fill();
  b.fillStyle = '#f5e9cb';
  b.beginPath(); b.arc(mx, my, 30, 0, TAU); b.fill();
  b.fillStyle = 'rgba(200,180,150,0.35)';
  b.beginPath(); b.arc(mx - 9, my + 5, 6, 0, TAU); b.fill();
  b.beginPath(); b.arc(mx + 8, my - 8, 4, 0, TAU); b.fill();

  const rnd = mulberry32(7);

  function stalk(x0, lean, w){
    let y = H + 20, x = x0;
    b.fillStyle = 'rgba(8,11,26,0.92)';
    while(y > -40){
      const seg = 80 + rnd()*70;
      b.save();
      b.translate(x, y);
      b.rotate(lean);
      b.beginPath();
      b.roundRect(-w/2, -seg, w, seg - 4, w/2);
      b.fill();
      b.restore();
      // 节上生枝叶
      if(rnd() < 0.75 && y < H*0.95){
        const nLeaf = 2 + (rnd()*3 | 0);
        for(let i = 0; i < nLeaf; i++){
          const side = rnd() < 0.5 ? -1 : 1;
          const ang = side * (0.5 + rnd()*0.9) + lean;
          const len = 34 + rnd()*30;
          b.save();
          b.translate(x + side*w*0.4, y - seg + rnd()*seg*0.4);
          b.rotate(ang);
          b.beginPath();
          b.moveTo(0, 0);
          b.quadraticCurveTo(len*0.5, -len*0.16, len, 0);
          b.quadraticCurveTo(len*0.5,  len*0.16, 0, 0);
          b.fill();
          b.restore();
        }
      }
      y -= seg;
      x += Math.sin(lean) * seg * 0.4 + (rnd()-0.5)*6;
    }
  }
  stalk(36, -0.05, 13);
  stalk(86, 0.07, 9);
  if(W > 700){ stalk(W - 52, 0.05, 11); stalk(W - 108, -0.08, 7); }
  moonBambooLayer = c;
}

/* 前景层：暗角 + 胶片颗粒 */
function buildFgLayer(){
  if(!grainTile){
    grainTile = document.createElement('canvas');
    grainTile.width = grainTile.height = 128;
    const g = grainTile.getContext('2d');
    const img = g.createImageData(128, 128);
    const rnd = mulberry32(99);
    for(let i = 0; i < img.data.length; i += 4){
      const v = rnd()*255 | 0;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 7;
    }
    g.putImageData(img, 0, 0);
  }
  const [c, b] = newLayer();
  const vig = b.createRadialGradient(W*0.5, H*0.46, Math.min(W,H)*0.35, W*0.5, H*0.5, Math.max(W,H)*0.75);
  vig.addColorStop(0, 'rgba(5,6,16,0)');
  vig.addColorStop(1, 'rgba(5,6,16,0.55)');
  b.fillStyle = vig; b.fillRect(0, 0, W, H);
  b.fillStyle = b.createPattern(grainTile, 'repeat');
  b.fillRect(0, 0, W, H);
  fgLayer = c;
}

const RECORDED_RPS = 2.33;      // 录音里玩具的甩速(圈/秒)，由包络自相关测得
let AC = null, au = null;       // au.mode: null(加载中) | 'sample' | 'synth'

// 音频心跳：iOS 从后台切回后，上下文可能"状态 running 却无声"
// (currentTime 停走，输出管线已被系统回收)，这种僵尸只能拆掉重建
let acTimeLast = 0, acAdvanceWall = 0;
let acRebuilds = [];            // 最近自动重建时间戳：限频，防拆建循环
let sampleBytes = null;         // base64 只解一次，重建时复用
function audioStalled(){
  return !!AC && AC.state === 'running' && !document.hidden
      && acAdvanceWall > 0 && performance.now() - acAdvanceWall > 1500;
}

function ensureAudio(fromGesture){
  if(AC && (AC.state === 'closed' || audioStalled())){
    const now = performance.now();
    acRebuilds = acRebuilds.filter(ts => now - ts < 60000);
    if(!fromGesture && acRebuilds.length >= 3) return;   // 无手势自动重建 60s 限 3 次
    acRebuilds.push(now);
    try{ AC.close(); }catch(_){}
    AC = null; au = null;
    acTimeLast = 0; acAdvanceWall = 0;
  }
  if(AC){
    // 'suspended' 与 iOS 非标准的 'interrupted' 一并恢复
    if(AC.state !== 'running') AC.resume().catch(() => {});
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  AC = new Ctx();
  AC.resume().catch(() => {});
  acTimeLast = 0; acAdvanceWall = performance.now();

  // 公共输出链：总闸 → 压限 → 分析器 → 扬声器
  const master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  const analyser = AC.createAnalyser(); analyser.fftSize = 1024;
  master.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);
  au = { master, analyser, mode: null };

  // 解码内嵌录音；任何一步失败都回退合成
  try{
    if(!sampleBytes){
      const bin = atob(ZZL_SAMPLE);
      sampleBytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) sampleBytes[i] = bin.charCodeAt(i);
    }
    // decodeAudioData 会 detach 传入的 buffer，给副本以便重建时复用
    AC.decodeAudioData(sampleBytes.slice().buffer,
      buf => startSampleVoice(buf),
      () => startSynthVoice());
  }catch(_){ startSynthVoice(); }
}

/* 采样声部：把录音尾部 50ms 等功率交叉淡化烘进头部，做成无缝循环 */
function startSampleVoice(buf){
  if(!AC || !au || au.mode) return;
  const sr = buf.sampleRate;
  const F = Math.floor(sr*0.05);
  const loopLen = buf.length - F;
  if(loopLen <= sr*0.2){ startSynthVoice(); return; }
  const loop = AC.createBuffer(1, loopLen, sr);
  const s = buf.getChannelData(0), d = loop.getChannelData(0);
  d.set(s.subarray(0, loopLen));
  for(let i = 0; i < F; i++){
    const p = Math.PI/2 * i/F;
    d[i] = s[i]*Math.sin(p) + s[loopLen + i]*Math.cos(p);
  }
  const src = AC.createBufferSource();
  src.buffer = loop; src.loop = true;
  src.connect(au.master);
  src.start();
  au.sample = src;
  au.mode = 'sample';
}

/* 合成声部（兜底）：黏滑摩擦脉冲 → 调幅 → 扫频带通 → 膜腔共振峰 */
function startSynthVoice(){
  if(!AC || !au || au.mode) return;
  const t = AC.currentTime;

  const osc = AC.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 70;
  const shaper = AC.createWaveShaper();
  {
    const n = 1024, curve = new Float32Array(n);
    for(let i = 0; i < n; i++){
      const x = i/(n - 1)*2 - 1;
      curve[i] = Math.tanh(x*3.2);
    }
    shaper.curve = curve;
    shaper.oversample = '2x';
  }
  osc.connect(shaper);

  const am = AC.createGain(); am.gain.value = 0.62;
  const lfo = AC.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 30;
  const lfoAmt = AC.createGain(); lfoAmt.gain.value = 0.34;
  lfo.connect(lfoAmt); lfoAmt.connect(am.gain);
  shaper.connect(am);

  const nBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = nBuf.getChannelData(0);
  for(let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
  const noise = AC.createBufferSource();
  noise.buffer = nBuf; noise.loop = true;
  const nFil = AC.createBiquadFilter();
  nFil.type = 'bandpass'; nFil.frequency.value = 2500; nFil.Q.value = 0.7;
  const nGain = AC.createGain(); nGain.gain.value = 0;
  noise.connect(nFil); nFil.connect(nGain);

  const bus = AC.createGain(); bus.gain.value = 0.9;
  am.connect(bus); nGain.connect(bus);
  const wah = AC.createBiquadFilter();
  wah.type = 'bandpass'; wah.frequency.value = 900; wah.Q.value = 2.2;
  bus.connect(wah);

  const sum = AC.createGain(); sum.gain.value = 1;
  const formant = (freq, q, g) => {
    const f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const fg = AC.createGain(); fg.gain.value = g;
    wah.connect(f); f.connect(fg); fg.connect(sum);
  };
  formant(1050, 9, 0.9);
  formant(2150, 11, 0.6);
  formant(3350, 13, 0.4);
  const bleed = AC.createGain(); bleed.gain.value = 0.07;
  wah.connect(bleed); bleed.connect(sum);

  const hp = AC.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 360;
  sum.connect(hp); hp.connect(au.master);

  osc.start(t); lfo.start(t); noise.start(t);
  Object.assign(au, { osc, lfo, nGain, wah });
  au.mode = 'synth';
}

function updateAudio(){
  if(!AC || AC.state !== 'running' || !au || !au.mode) return;
  const t = AC.currentTime;
  // 总响度
  au.master.gain.setTargetAtTime(0.85*Math.pow(active, 1.3), t, 0.07);

  if(au.mode === 'sample'){
    // 甩得越快回放越快越高；再叠每圈相位的音高微摆(张力/多普勒感)
    const rate = clamp(Math.pow(rps/RECORDED_RPS, 0.7), 0.6, 1.5);
    au.sample.playbackRate.setTargetAtTime(active > 0.02 ? rate : 0.9, t, 0.09);
    au.sample.detune.setTargetAtTime(50*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.04);
    return;
  }

  // —— 合成兜底的参数 —— //
  const f0 = clamp(55 + rps*17, 50, 195);
  au.osc.frequency.setTargetAtTime(f0, t, 0.06);
  au.osc.detune.setTargetAtTime(46*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.03);
  au.lfo.frequency.setTargetAtTime(24 + rps*4.5, t, 0.1);
  const wf = 760 + 520*active + (430 + 330*active)*Math.sin(theta - 0.7);
  au.wah.frequency.setTargetAtTime(Math.max(320, wf), t, 0.025);
  au.nGain.gain.setTargetAtTime((0.03 + 0.17*active)*clamp(drive*4, 0, 1), t, 0.08);
}

/* ============================================================
   物理
   ============================================================ */
function physStep(h){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;
  let ax = 0, ay = GRAV;
  if(d > ROPE_LEN){                       // 绳只拉不推
    const vrad = tube.vx*ux + tube.vy*uy;
    const f = -ROPE_K*(d - ROPE_LEN) - ROPE_D*vrad;
    ax += f*ux; ay += f*uy;
  }
  ax -= AIR_DRAG*tube.vx;
  ay -= AIR_DRAG*tube.vy;
  tube.vx += ax*h; tube.vy += ay*h;
  tube.x += tube.vx*h; tube.y += tube.vy*h;
}

function update(dt){
  // 甩杆目标：手动指针 / 自动画圈 / 甩手机体感
  if(auto.on){
    auto.rps += (3.4 - auto.rps)*Math.min(1, dt*1.1);
    auto.phase += auto.rps*TAU*dt;
    target.x = auto.cx + AUTO_R*Math.cos(auto.phase);
    target.y = auto.cy + AUTO_R*Math.sin(auto.phase);
  }else{
    auto.rps *= Math.max(0, 1 - dt*3);
    if(motion.on && !pointer.down){
      // 开了体感却收不到传感器事件(权限/环境问题)，2.5s 后自动退出并提示
      if(!motion.gotEvent && performance.now() - motion.enabledAt > 2500){
        setMotion(false);
        flashBtn(motionBtn, '不可用');
      }else{
        const cx = W*0.5, cy = H*0.42;
        const R = Math.min(W, H)*0.22;
        target.x = clamp(cx + motion.ax*16, cx - R, cx + R);
        target.y = clamp(cy - motion.ay*16, cy - R, cy + R);
      }
    }
  }
  const k = 1 - Math.exp(-dt*26);
  stick.x += (target.x - stick.x)*k;
  stick.y += (target.y - stick.y)*k;

  // 定步长积分
  let acc = dt;
  const h = 1/240;
  while(acc > 1e-6){ const s = Math.min(h, acc); physStep(s); acc -= s; }

  // 角速度(发声核心)：绳方向的转动快慢
  theta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
  let dth = theta - prevTheta;
  while(dth >  Math.PI) dth -= TAU;
  while(dth < -Math.PI) dth += TAU;
  omega += (dth/dt - omega)*Math.min(1, dt*9);
  prevTheta = theta;
  rps = Math.abs(omega)/TAU;

  // 手动甩出的圈数计入「哇」——自动甩不算数
  if(!auto.on && active > 0.3){
    revAccum += Math.abs(dth);
    if(revAccum >= TAU){
      const n = Math.floor(revAccum/TAU);
      revAccum -= n*TAU;
      addWah(n);
    }
  }else{
    revAccum = 0;
  }

  ropeDist = Math.hypot(tube.x - stick.x, tube.y - stick.y);
  taut = clamp((ropeDist/ROPE_LEN - 0.88)/0.12, 0, 1);
  drive = clamp((rps - 1.1)/2.6, 0, 1);
  const tgt = Math.pow(drive, 1.25)*taut;
  active += (tgt - active)*Math.min(1, dt*(tgt > active ? 10 : 3.2));

  // 完全静置 8s 后挂起音频线程省电；任何交互的 ensureAudio 都会恢复
  if(active < 0.02 && rps < 0.15 && !pointer.down && !auto.on && !motion.on){
    idleTime += dt;
    if(idleTime > 8 && AC && AC.state === 'running') AC.suspend().catch(() => {});
  }else{
    idleTime = 0;
  }

  updateAudio();

  // 音频心跳采样：currentTime 停走 1.5s 即判僵尸，就地重建
  // (重建发生在无手势的帧循环里时，新上下文可能挂起，由解锁药丸引导恢复)
  if(AC && AC.state === 'running'){
    const ct = AC.currentTime;
    if(ct !== acTimeLast){
      acTimeLast = ct;
      acAdvanceWall = performance.now();
    }else if(audioStalled()){
      ensureAudio();
    }
  }else if(AC){
    // 非 running(静置挂起/来电中断等)期间宽限期持续顺延，
    // 恢复 running 的瞬间才不会把健康上下文误判成僵尸杀掉
    acAdvanceWall = performance.now();
  }

  // "想出声却出不了"：正在甩/自动/体感模式下上下文却没在跑 → 重新亮出解锁引导
  const wantSound = auto.on || motion.on || pointer.down || active > 0.05;
  if(wantSound && AC && AC.state !== 'running') needSoundTime += dt;
  else needSoundTime = 0;

  stEls.mineWrap.classList.toggle('hot', active > 0.3);
  if(active > 0.3){
    singTime += dt;
    if(!hintGone && singTime > 1.0){
      hintGone = true;
      document.getElementById('hint').classList.add('gone');
    }
  }
  spawnFx(dt);
}

/* ============================================================
   视觉特效粒子
   ============================================================ */
const ripples = [];   // 声波涟漪
const cries = [];     // 飘出的「哇」
const trail = [];     // 竹筒运动轨迹
let rippleTimer = 0, cryTimer = 0;

function spawnFx(dt){
  trail.unshift({ x: tube.x, y: tube.y });
  if(trail.length > 16) trail.pop();

  rippleTimer -= dt; cryTimer -= dt;
  if(active > 0.15 && rippleTimer <= 0){
    rippleTimer = 0.09;
    ripples.push({ x: tube.x, y: tube.y, r: 16, age: 0, life: 0.7, str: active });
  }
  if(active > 0.3 && cryTimer <= 0 && cries.length < 36){
    cryTimer = 0.22;
    const ux = (tube.x - stick.x)/(ropeDist || 1);
    const uy = (tube.y - stick.y)/(ropeDist || 1);
    const sgn = omega >= 0 ? 1 : -1;
    // 切向飞出
    const tx = -uy*sgn, ty = ux*sgn;
    const sp = 90 + Math.random()*60;
    cries.push({
      x: tube.x + ux*14, y: tube.y + uy*14,
      vx: tx*sp + ux*30, vy: ty*sp + uy*30 - 20,
      age: 0, life: 1.1,
      size: 20 + 30*active,
      rot: (Math.random() - 0.5)*0.8
    });
  }
  for(let i = ripples.length - 1; i >= 0; i--){
    const p = ripples[i];
    p.age += dt; p.r += (200 + 160*p.str)*dt;
    if(p.age >= p.life) ripples.splice(i, 1);
  }
  for(let i = cries.length - 1; i >= 0; i--){
    const p = cries[i];
    p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - dt*1.2); p.vy = p.vy*(1 - dt*1.2) - 26*dt;
    if(p.age >= p.life) cries.splice(i, 1);
  }
}

/* ============================================================
   绘制
   ============================================================ */
function draw(now, dt){
  // 背景（天空+暖光，离屏层）
  if(bgLayer && bgLayer.width > 0) ctx.drawImage(bgLayer, 0, 0, W, H);

  // 星
  for(const s of stars){
    const tw = s.a*(0.6 + 0.4*Math.sin(now*s.sp + s.ph));
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#e8ecff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 月 + 竹影（离屏层）
  if(moonBambooLayer && moonBambooLayer.width > 0) ctx.drawImage(moonBambooLayer, 0, 0, W, H);

  // 流萤（按真实 dt 漂移，高刷屏不加速）
  for(const f of flies){
    f.x += f.vx*dt; f.y += f.vy*dt;
    if(f.x < -10) f.x = W + 10; if(f.x > W + 10) f.x = -10;
    if(f.y < H*0.3) f.vy = Math.abs(f.vy);
    if(f.y > H + 10) f.y = H*0.5;
    f.vx += Math.sin(now*0.7 + f.ph)*(18*dt);
    f.vy += Math.cos(now*0.9 + f.ph)*(12*dt);
    const glow = Math.max(0, Math.sin(now*f.sp + f.ph));
    if(glow < 0.05) continue;
    ctx.globalAlpha = glow*0.85;
    ctx.fillStyle = '#ffd98a';
    ctx.shadowColor = '#ffc35e'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // 声波涟漪
  for(const p of ripples){
    const t = p.age/p.life;
    ctx.globalAlpha = (1 - t)*0.35*p.str;
    ctx.strokeStyle = '#ffcf9e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 运动残影：渐隐光点（高速下连线会成折线，点更好看）
  const spNorm = clamp(rps/4, 0, 1);
  if(spNorm > 0.05 && trail.length > 2){
    ctx.fillStyle = '#ffb36b';
    for(let i = 1; i < trail.length; i++){
      const f = 1 - i/trail.length;
      ctx.globalAlpha = f*0.3*spNorm;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 1.5 + 3.5*f, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  if(use3d){
    toy3d.render({ now, dt, stick, tube, ropeLen: ROPE_LEN, ropeDist,
                   omega, active, stickTilt: STICK_TILT3D });
  }else{
    drawToy(now, dt);
  }

  // 飘出的「哇」
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const p of cries){
    const t = p.age/p.life;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot*t);
    ctx.globalAlpha = (1 - t)*(1 - t)*0.95;
    ctx.font = `${(p.size*(1 + 0.5*t)).toFixed(1)}px ${FONT}`;
    ctx.shadowColor = 'rgba(255,150,60,0.9)';
    ctx.shadowBlur = 18*(1 - t);
    ctx.fillStyle = '#ffb066';
    ctx.fillText('哇', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 暗角 + 颗粒（离屏层）
  if(fgLayer && fgLayer.width > 0) ctx.drawImage(fgLayer, 0, 0, W, H);
}

function drawToy(now, dt){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;

  // 红线：松则垂，紧则直
  ctx.strokeStyle = 'rgba(216,74,53,0.92)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y);
  if(d < ROPE_LEN*0.97){
    const sag = (ROPE_LEN - d)*0.55;
    ctx.quadraticCurveTo((stick.x + tube.x)/2, (stick.y + tube.y)/2 + sag, tube.x, tube.y);
  }else{
    ctx.lineTo(tube.x, tube.y);
  }
  ctx.stroke();

  // 甩杆：细竹签，杆梢串两颗红珠（照实物）；局部坐标绘制以复用渐变
  const sa = 1.15;                 // 杆的固定倾角
  const sdx = Math.cos(sa), sdy = Math.sin(sa);
  ctx.save();
  ctx.translate(stick.x, stick.y);
  if(!stickGrad){
    stickGrad = ctx.createLinearGradient(0, 0, sdx*88, sdy*88);
    stickGrad.addColorStop(0, '#e2cd9a'); stickGrad.addColorStop(1, '#a8894f');
  }
  ctx.strokeStyle = stickGrad;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sdx*8, sdy*8);
  ctx.lineTo(sdx*88, sdy*88);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(sdx*12 - sdy*1.4, sdy*12 + sdx*1.4);
  ctx.lineTo(sdx*76 - sdy*1.4, sdy*76 + sdx*1.4);
  ctx.stroke();
  // 红珠
  const bead = (bx, by, r) => {
    ctx.fillStyle = '#c23324';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,180,0.55)';
    ctx.beginPath(); ctx.arc(bx - r*0.3, by - r*0.35, r*0.32, 0, TAU); ctx.fill();
  };
  bead(sdx*14, sdy*14, 4.6);
  bead(sdx*4,  sdy*4,  6);
  ctx.restore();

  // 蝉形竹筒：膜端(头)朝绳，筒身沿绳方向甩出
  ctx.save();
  ctx.translate(tube.x, tube.y);
  ctx.rotate(Math.atan2(uy, ux) - Math.PI/2);
  ctx.scale(1.35, 1.35);

  // ycd.png 替换手绘蝉身：绕自身中心自旋，转的就是这张图
  const imgOk = ycdImg.complete && ycdImg.naturalWidth > 0;
  if(imgOk){
    spin2d += (omega*0.45 + Math.sin(now*0.6)*0.15) * dt;
    ctx.rotate(spin2d);
    const iw = ycdImg.naturalWidth, ih = ycdImg.naturalHeight;
    const PH = 54, PW = PH * iw / ih;   // 显示高度与筒身+翼幅相当，宽度按图比例
    ctx.drawImage(ycdImg, -PW/2, -PH/2, PW, PH);
  }else{
    // 图片加载中/失败：回落手绘蝉身（不空白，图片就绪后自动切换）
    // 筒身：浅竹色
    if(!tubeGrad){
      tubeGrad = ctx.createLinearGradient(-12, 0, 12, 0);
      tubeGrad.addColorStop(0, '#b7a271');
      tubeGrad.addColorStop(0.3, '#eadfb8');
      tubeGrad.addColorStop(0.62, '#dfd0a2');
      tubeGrad.addColorStop(1, '#9b8452');
    }
    ctx.fillStyle = tubeGrad;
    ctx.beginPath();
    ctx.roundRect(-12, 4, 24, 46, 6);
    ctx.fill();

    // 尾端开口
    ctx.fillStyle = '#4c3d24';
    ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(234,223,184,0.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0.05, Math.PI - 0.05); ctx.stroke();

    // 一对竹蝉翼：转得越快离心张得越开，同时高频振翅
    const spread  = 0.30 + active*0.38;
    const flutter = active*Math.sin(now*46)*0.22;
    const wing = side => {
      ctx.save();
      ctx.translate(side*9, 13);
      ctx.rotate(side*(spread + flutter));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(side*13, 9, side*14, 30, side*5, 42);
      ctx.bezierCurveTo(side*-1, 33, side*-4, 12, 0, 0);
      ctx.fillStyle = 'rgba(243,235,211,0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,120,70,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // 翼脉
      ctx.strokeStyle = 'rgba(150,120,70,0.45)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(side*2, 4);  ctx.quadraticCurveTo(side*9, 18, side*5, 38);
      ctx.moveTo(side*1, 6);  ctx.quadraticCurveTo(side*3, 20, side*1.5, 34);
      ctx.stroke();
      ctx.restore();
    };
    wing(-1); wing(1);

    // 红箍(蝉头)
    ctx.fillStyle = '#cf3b2a';
    ctx.beginPath();
    ctx.roundRect(-12.5, 2, 25, 10, 4);
    ctx.fill();

    // 膜面(蒙在红箍里的竹膜) + 发声时透光
    ctx.fillStyle = '#f6eed8';
    ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 4.2, 0, 0, TAU); ctx.fill();
    if(active > 0.05){
      ctx.globalAlpha = active*0.85;
      ctx.shadowColor = '#ffcf8e'; ctx.shadowBlur = 18*active;
      ctx.fillStyle = '#ffe9bd';
      ctx.beginPath(); ctx.ellipse(0, 3, 8.5, 3.4, 0, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // 一对黑眼睛，点在红箍两侧
    const eye = side => {
      ctx.fillStyle = '#17130c';
      ctx.beginPath(); ctx.arc(side*8.5, 7.5, 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(side*8.5 - 0.7, 6.8, 0.7, 0, TAU); ctx.fill();
    };
    eye(-1); eye(1);

    // 膜心线结
    ctx.fillStyle = '#d84a35';
    ctx.beginPath(); ctx.arc(0, 2, 2, 0, TAU); ctx.fill();
  }

  ctx.restore();
}

/* ============================================================
   主循环 & 交互
   ============================================================ */
let last = performance.now();
let hudTimer = 0;
const rpsEl = document.getElementById('rps');
const autoBtn = document.getElementById('autoBtn');

/* —— 3D 小蝉渲染层（可选增强）——
   动态 import：HTTP 下加载 vendored three.js 换上 3D 模型；
   file:// 直开、WebGL 不可用或加载失败时静默回落 2D 手绘，承诺不破。 */
const cv3d = document.getElementById('cv3d');
const d3Btn = document.getElementById('d3Btn');
let toy3d = null, use3d = false;
let want3d = true;
try{ want3d = localStorage.getItem('zzl_3d') !== '0'; }catch(_){}
const STICK_TILT3D = Math.PI/2 - 1.15;   // 与 2D 版杆倾角一致（屏幕系→世界系换算）
function toyScale(){ return clamp(Math.min(W, H)*0.155, 64, 88); }  // 筒身高对应像素
function set3d(on){
  use3d = !!(on && toy3d);
  d3Btn.classList.toggle('on', use3d);
  d3Btn.textContent = use3d ? '手绘小蝉' : '3D 小蝉';
  cv3d.style.display = use3d ? '' : 'none';
  try{ localStorage.setItem('zzl_3d', use3d ? '1' : '0'); }catch(_){}
}
import('./3d/boot3d.js').then(m => {
  toy3d = m.init(cv3d);
  if(!toy3d) return;
  toy3d.resize(W, H, DPR, toyScale());
  d3Btn.style.display = '';
  set3d(want3d);
}).catch(() => {});
d3Btn.addEventListener('click', e => {
  e.stopPropagation();
  set3d(!use3d);
});

function frame(now){
  // 有些嵌入环境不派发 resize 事件，每帧自查尺寸变化（0 尺寸视为瞬态，忽略）
  if(window.innerWidth > 0 &&
     (window.innerWidth !== W || window.innerHeight !== H)) resize();
  // rAF 出现大间隙说明页面被冻结过(部分 WebView 不派发 visibilitychange)，宽限期重置
  if(now - last > 1000) acAdvanceWall = performance.now();
  const dt = Math.min(0.05, (now - last)/1000) || 0.016;
  last = now;
  update(dt);
  draw(now/1000, dt);
  hudTimer -= dt;
  if(hudTimer <= 0){
    hudTimer = 0.15;
    rpsEl.textContent = rps.toFixed(1);
    syncUnlock();
  }
  requestAnimationFrame(frame);
}

function setAuto(on){
  auto.on = on;
  autoBtn.classList.toggle('on', on);
  autoBtn.textContent = on ? '停一停' : '自动甩';
  if(on){
    interacted = true;
    if(motion.on) setMotion(false);
    auto.cx = clamp(stick.x, W*0.28, W*0.72);
    auto.cy = clamp(stick.y, H*0.26, H*0.6);
    auto.phase = Math.atan2(stick.y - auto.cy, stick.x - auto.cx);
    ensureAudio(true);
  }
}

autoBtn.addEventListener('click', e => {
  e.stopPropagation();
  setAuto(!auto.on);
});

/* —— 甩手机体感模式：握住手机划圈，重力方向在机身坐标里转动 —— */
const motion = { on: false, ax: 0, ay: 0, bx: 0, by: 0,
                 handler: null, gotEvent: false, enabledAt: 0 };
const motionBtn = document.getElementById('motionBtn');
// devicemotion 只在安全上下文(HTTPS/file)派发，http 下不显示按钮免得点了没反应
if(typeof DeviceMotionEvent !== 'undefined' && 'ontouchstart' in window && window.isSecureContext){
  motionBtn.style.display = '';
}

function flashBtn(btn, text){
  btn.textContent = text;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = '甩手机'; btn.disabled = false; }, 1600);
}

async function setMotion(on){
  if(on && typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{
      const r = await DeviceMotionEvent.requestPermission();  // iOS 需授权
      if(r !== 'granted'){ flashBtn(motionBtn, '未授权'); return; }
    }catch(_){ flashBtn(motionBtn, '未授权'); return; }
  }
  motion.on = on;
  motionBtn.classList.toggle('on', on);
  motionBtn.textContent = on ? '停一停' : '甩手机';
  if(on){
    interacted = true;
    if(auto.on) setAuto(false);
    ensureAudio(true);
    motion.ax = motion.ay = motion.bx = motion.by = 0;
    motion.gotEvent = false;
    motion.enabledAt = performance.now();
    if(!motion.handler){
      motion.handler = e => {
        const g = e.accelerationIncludingGravity;
        if(!g || g.x == null) return;
        motion.gotEvent = true;
        // 慢基线滤掉静止重力，留下随挥舞转动的分量
        motion.bx += (g.x - motion.bx)*0.02;
        motion.by += (g.y - motion.by)*0.02;
        motion.ax += ((g.x - motion.bx) - motion.ax)*0.35;
        motion.ay += ((g.y - motion.by) - motion.ay)*0.35;
      };
    }
    window.addEventListener('devicemotion', motion.handler);
  }else if(motion.handler){
    window.removeEventListener('devicemotion', motion.handler);
  }
}
motionBtn.addEventListener('click', e => {
  e.stopPropagation();
  setMotion(!motion.on);
});

cv.addEventListener('pointerdown', e => {
  if(pointer.down) return;                 // 已有手指在甩，忽略误触的第二指
  pointer.down = true;
  pointer.id = e.pointerId;
  // 拇指按住时玩具画在指尖正下会被手挡住，触摸输入把锚点抬到指尖上方
  pointer.lift = e.pointerType === 'touch' ? Math.min(110, ROPE_LEN*0.9) : 0;
  interacted = true;
  cv.classList.add('holding');
  cv.setPointerCapture(e.pointerId);
  if(auto.on) setAuto(false);
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
  ensureAudio(true);
});
cv.addEventListener('pointermove', e => {
  if(!pointer.down || e.pointerId !== pointer.id) return;
  target.x = e.clientX;
  target.y = Math.max(12, e.clientY - pointer.lift);
});
function release(e){
  if(pointer.down && e && e.pointerId !== pointer.id) return;
  pointer.down = false;
  pointer.id = null;
  cv.classList.remove('holding');
  ensureAudio(true);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

// 音频解锁只认这些事件：Android Chrome 上触摸授予激活的是 touchend
// (pointerup 在它之前派发、拿不到激活)，click/keydown 覆盖按钮和键盘
['touchend', 'click', 'keydown'].forEach(type =>
  document.addEventListener(type, () => ensureAudio(true), { capture: true, passive: true }));

// 首次开声引导：触屏设备且音频没在跑时显示，解锁后自动消失
const unlockEl = document.getElementById('unlock');
if('ontouchstart' in window) unlockEl.hidden = false;
unlockEl.addEventListener('click', e => {
  e.stopPropagation();
  ensureAudio(true);      // click 自带激活，这里 resume 必然放行
});
function syncUnlock(){
  if(AC && AC.state === 'running'){
    if(!unlockEl.hidden && !unlockEl.classList.contains('gone')){
      unlockEl.classList.add('gone');
      setTimeout(() => { if(unlockEl.classList.contains('gone')) unlockEl.hidden = true; }, 600);
    }
  }else if(needSoundTime > 1.2){
    // 后台切回后重建的上下文没手势解锁不了，自动甩/体感模式又不会再点屏幕——把药丸请回来
    unlockEl.classList.remove('gone');
    unlockEl.hidden = false;
  }
}

window.addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat){
    e.preventDefault();
    setAuto(!auto.on);
  }
});

document.addEventListener('visibilitychange', () => {
  if(!AC) return;
  if(document.hidden){
    AC.suspend().catch(() => {});
  }else{
    acAdvanceWall = performance.now();   // 宽限期重置，别把后台冻结误判成僵尸
    AC.resume().catch(() => {});
  }
});
window.addEventListener('pageshow', () => {   // bfcache 恢复时也拉一把
  if(AC){
    acAdvanceWall = performance.now();
    AC.resume().catch(() => {});
  }
});

/* ============================================================
   计数 —— 全站实时(云端 Durable Object) + 个人(浏览器本地)
   ============================================================ */
const API_ORIGIN = location.host === 'zhuzhiliao.imsai.cc'
  ? location.origin                       // 同源走 /api/* 路由
  : 'https://zhuzhiliao.imsai.cc';        // pages.dev / 本地文件 / 局域网 等一律走主域名

const stEls = {
  root: document.getElementById('stats'),
  online: document.getElementById('stOnline'),
  visitors: document.getElementById('stVisitors'),
  visits: document.getElementById('stVisits'),
  wahs: document.getElementById('stWahs'),
  mine: document.getElementById('stMine'),
  mineWrap: document.getElementById('stMineWrap'),
};

let uid = '', myWah = 0;
try{
  uid = localStorage.getItem('zzl_uid') || '';
  if(!uid){
    uid = (crypto.randomUUID && crypto.randomUUID())
       || (Date.now().toString(36) + Math.random().toString(36).slice(2));
    localStorage.setItem('zzl_uid', uid);
  }
  myWah = parseInt(localStorage.getItem('zzl_mywah') || '0', 10) || 0;
}catch(_){ /* 无痕模式等 localStorage 不可用时静默降级 */ }

let ws = null, wsRetry = 0, saidHi = false, pendingWah = 0, lastWahs = -1;
const fmt = n => n.toLocaleString('zh-Hans-CN');

function renderStats(m){
  stEls.online.textContent = fmt(m.online);
  stEls.visitors.textContent = fmt(m.visitors);
  stEls.visits.textContent = fmt(m.visits);
  stEls.wahs.textContent = fmt(m.wahs);
  if(lastWahs >= 0 && m.wahs > lastWahs){
    stEls.wahs.classList.remove('wahflash');
    void stEls.wahs.offsetWidth;         // 重启动画
    stEls.wahs.classList.add('wahflash');
  }
  lastWahs = m.wahs;
}
function renderMine(){ stEls.mine.textContent = fmt(myWah); }

function wsConnect(){
  if(ws && ws.readyState <= 1) return;
  let sock;
  try{ sock = new WebSocket(API_ORIGIN.replace(/^http/, 'ws') + '/api/ws'); }
  catch(_){ return; }
  ws = sock;
  sock.onopen = () => {
    wsRetry = 0;
    sock.send(JSON.stringify({ t: 'hi', uid, v: saidHi ? 0 : 1 }));
    saidHi = true;                       // 断线重连不重复计访问
  };
  sock.onmessage = ev => {
    try{
      const m = JSON.parse(ev.data);
      if(m.t === 'stats') renderStats(m);
    }catch(_){}
  };
  sock.onclose = () => {
    ws = null;
    setTimeout(wsConnect, Math.min(30000, 1000*Math.pow(2, wsRetry++)));
  };
  sock.onerror = () => { try{ sock.close(); }catch(_){} };
}

// 心跳保活（服务端由运行时自动应答，不唤醒 DO）；本地攒的哇 1.2s 批量上报
setInterval(() => { if(ws && ws.readyState === 1) ws.send('ping'); }, 25000);
setInterval(() => {
  if(pendingWah > 0 && ws && ws.readyState === 1){
    const n = Math.min(pendingWah, 30);
    ws.send(JSON.stringify({ t: 'wah', n }));
    pendingWah -= n;
  }
}, 1200);

// 页面关闭前把没上报的哇用 beacon 补上
window.addEventListener('pagehide', () => {
  if(pendingWah > 0 && navigator.sendBeacon){
    navigator.sendBeacon(API_ORIGIN + '/api/wah', JSON.stringify({ n: pendingWah }));
    pendingWah = 0;
  }
});

let mySaveTimer = 0;
function addWah(n){
  myWah += n; pendingWah += n;
  renderMine();
  stEls.mineWrap.classList.remove('minepop');
  void stEls.mineWrap.offsetWidth;      // 重启动画
  stEls.mineWrap.classList.add('minepop');
  if(!mySaveTimer){
    mySaveTimer = setTimeout(() => {
      mySaveTimer = 0;
      try{ localStorage.setItem('zzl_mywah', String(myWah)); }catch(_){}
    }, 800);
  }
}

stEls.root.hidden = false;
renderMine();
wsConnect();

/* —— Service Worker：安卓 Chrome 的安装提示以此为门槛，顺带离线可玩 —— */
if('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* —— 装进桌面（PWA 安装 / iOS 添加到主屏幕指引） —— */
const installBtn = document.getElementById('installBtn');
(function(){
  const standalone = matchMedia('(display-mode: standalone)').matches
                  || navigator.standalone === true;
  if(standalone){ installBtn.style.display = 'none'; return; }  // 已在桌面 app 里
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let tip = null;
  installBtn.addEventListener('click', async e => {
    e.stopPropagation();
    if(deferredPrompt){                  // Android / 桌面 Chrome：原生安装
      deferredPrompt.prompt();
      await deferredPrompt.userChoice.catch(() => {});
      deferredPrompt = null;
      installBtn.style.display = 'none';
      return;
    }
    if(tip){ tip.remove(); tip = null; return; }
    tip = document.createElement('div');
    tip.className = 'installtip';
    tip.innerHTML = isIOS
      ? '用 Safari 打开本页<br>点分享 <b>&#x2191;</b> → 「添加到主屏幕」<br><span style="opacity:.6;font-size:12px">(点此关闭)</span>'
      : '安卓 Chrome/Edge：菜单 &#8942; → 「安装应用」或「添加到主屏幕」<br>桌面 Chrome：地址栏右侧安装图标<br>Safari：分享 → 「添加到程序坞/主屏幕」<br><span style="opacity:.6;font-size:12px">(点此关闭)</span>';
    tip.addEventListener('click', () => { tip.classList.add('gone'); setTimeout(() => { tip && tip.remove(); tip = null; }, 400); });
    document.body.appendChild(tip);
    setTimeout(() => { if(tip){ tip.classList.add('gone'); setTimeout(() => { tip && tip.remove(); tip = null; }, 400); } }, 8000);
  });
})();
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', resize);
resize();   // 内部会把竹筒挂到屏幕中央，轻轻晃着

// 调试钩子（供自动化验证）
window.__zzl = {
  get state(){ return { rps, active, drive, taut, theta,
    stick: { x: stick.x, y: stick.y }, tube: { x: tube.x, y: tube.y },
    target: { x: target.x, y: target.y }, auto: auto.on,
    audio: AC ? AC.state : 'none', voice: au ? au.mode : null }; },
  step(dt = 1/60){   // 手动步进一帧（rAF 被冻结的嵌入环境里做自动化验证用）
    update(dt);
    draw(performance.now()/1000, dt);
  },
  rms(){
    if(!au) return 0;
    const buf = new Float32Array(au.analyser.fftSize);
    au.analyser.getFloatTimeDomainData(buf);
    let s = 0;
    for(let i = 0; i < buf.length; i++) s += buf[i]*buf[i];
    return Math.sqrt(s/buf.length);
  },
  setAuto
};

requestAnimationFrame(frame);
</script>
